name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # `composer setup` migrates, and CI has no MySQL: use a throwaway SQLite.
    # (The tests themselves use phpunit.xml's in-memory SQLite.)
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Frontend checks (format, lint, types)
        run: |
          npm run check
          npm run types:check

      - name: PHP style (Pint)
        run: vendor/bin/pint --test

      # PHPStan (`composer types:check`) is left out for now: the modules not
      # yet refactored still have ~550 findings. Add it back once they're done.
      - name: Tests
        run: php artisan test
